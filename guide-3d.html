<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spike.net — иди по цепи</title>
<meta name="description" content="Spike.net в 3D: иди по хромированной цепи вправо и открывай ленту находок из YouTube, Twitch, Steam, музыки и кино.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e11d1d;--cyan:#19e6ff;--bg:#050204;--ink:#f4f6f8;--muted:#a9b3bb;
  --head:'Unbounded','Arial Black',Impact,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#0a0508}}
:root[data-theme="light"]{--bg:#0a0508}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:400 16px/1.5 var(--body);background:radial-gradient(75vmax 55vmax at 72% 42%,#7a0c0c,transparent 70%),linear-gradient(#1c050a,var(--bg) 75%) fixed}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.65))}
.space{height:700vh}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 20px;pointer-events:none}
.logo{display:flex;align-items:center;gap:8px;font:800 18px var(--head);pointer-events:auto;color:#fff;text-decoration:none}
.logo svg{width:26px;height:26px;fill:#fff}
.pct{font:600 13px var(--body);color:var(--muted)}
.hero{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:center;padding:90px 22px 120px;pointer-events:none;max-width:700px}
h1{font:800 clamp(38px,11vw,92px)/1 var(--head);color:var(--cyan);text-transform:uppercase;margin:0 0 18px;text-shadow:0 0 34px rgba(25,230,255,.55)}
.hero p{margin:0;color:#e1e7ea;font-size:clamp(16px,4.4vw,20px);max-width:24em}
.down{margin-top:26px;font:600 14px var(--body);color:var(--muted);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.down{animation:none}}
.card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(520px,calc(100vw - 28px));z-index:5;background:rgba(14,6,12,.82);border:1px solid rgba(255,255,255,.18);border-left:6px solid var(--red);border-radius:18px;padding:16px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card .n{font:600 13px var(--body);color:var(--muted)}
.card h2{font:800 clamp(20px,5.4vw,28px)/1.15 var(--head);color:var(--cyan);margin:4px 0}
.card p{margin:0 0 12px;color:#cfd8dd;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.go{display:inline-flex;align-items:center;background:#fff;color:#0b0b0b;font:600 15px var(--body);text-decoration:none;border-radius:26px;padding:10px 18px}
.go:focus-visible,.dot:focus-visible,.logo:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer}
.dot[aria-current="true"]{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.fb{display:none;padding:110px 22px 40px;max-width:560px;margin:0 auto;position:relative;z-index:6}
.fb a{display:block;color:var(--cyan);font:700 20px var(--head);padding:14px 0;border-bottom:1px solid rgba(255,255,255,.2);text-decoration:none}
.nogl .fb{display:block}.nogl .space,.nogl .card,.nogl .hero,.nogl #gl,.nogl .vig{display:none}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas><div class="vig" aria-hidden="true"></div>
<div class="bar"><a class="logo" href="https://spike123net.github.io/Spike.net/"><svg viewBox="0 0 40 40" aria-hidden="true"><path id="lp"/></svg>SPIKE.NET</a><span class="pct" id="pct">0%</span></div>

<div class="hero" id="hero">
  <h1>Spike.net</h1>
  <p>Находки из YouTube, Twitch, Steam, музыки и кино. Иди по цепи вправо и открывай ленту.</p>
  <div class="down">Листай вниз →</div>
</div>

<div class="card" id="card" style="opacity:0">
  <div class="n" id="cn"></div><h2 id="ct"></h2><p id="cd"></p>
  <div class="row"><a class="go" id="cl" href="https://spike123net.github.io/Spike.net/" target="_blank" rel="noopener noreferrer">Открыть Spike.net →</a><div class="dots" id="dots"></div></div>
</div>
<div class="fb" id="fb"><h2 style="font:800 26px var(--head);margin:0 0 14px">Spike.net</h2><a href="https://spike123net.github.io/Spike.net/">Открыть сайт →</a></div>
<div class="space"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  function $(i){return document.getElementById(i)}
  var SITE='https://spike123net.github.io/Spike.net/';
  var D=[
    {t:'YouTube',d:'Видео-находки: ставь снежинки лучшим роликам.'},
    {t:'Twitch',d:'Стримы и клипы, которые не хочется потерять.'},
    {t:'Steam',d:'Игры, скидки и находки для вечера.'},
    {t:'Музыка',d:'Плейлисты и треки, которые зашли другим.'},
    {t:'Кино',d:'Фильмы и сериалы на любой вечер.'},
    {t:'Spike.net',d:'Вся лента находок на одном сайте. Заходи и добавляй свои ссылки.'}
  ],PX=[6,13,20,27,34,43];
  (function(){var d='',n=12;for(var i=0;i<n*2;i++){var r=i%2?7:19,a=Math.PI*i/n-Math.PI/2;d+=(i?'L':'M')+(20+Math.cos(a)*r).toFixed(1)+' '+(20+Math.sin(a)*r).toFixed(1)}$('lp').setAttribute('d',d+'Z')})();
  function nogl(){document.documentElement.classList.add('nogl')}
  if(!window.THREE){nogl();return}
  var R;try{R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true})}catch(e){nogl();return}
  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setClearColor(0x000000,0);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;R.outputEncoding=THREE.sRGBEncoding;
  var FOG=0x12040a,scene=new THREE.Scene();scene.fog=new THREE.FogExp2(FOG,.05);
  var cam=new THREE.PerspectiveCamera(50,1,.1,120);

  /* studio environment for realistic metal */
  var es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.BoxGeometry(36,36,36),new THREE.MeshBasicMaterial({color:0x0a0508,side:THREE.BackSide})));
  function pan(c,k,w,h,x,y,z){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m)}
  pan(0xffffff,5,18,4,0,16,0);pan(0xff2a2a,4.5,4,14,-16,2,3);pan(0x19e6ff,5,4,14,16,0,-2);pan(0xffffff,3,16,3,0,0,-16);pan(0xff2a2a,2,12,3,0,-16,2);pan(0xffffff,2.5,3,10,6,3,16);
  var pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(es,.02).texture;pm.dispose();
  var dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(2,5,6);scene.add(dl);scene.add(new THREE.AmbientLight(0xffffff,.22));

  /* materials & shared assets */
  var chrome=new THREE.MeshStandardMaterial({color:0xe4eaee,metalness:1,roughness:.14,envMapIntensity:1.3}),
      neon=new THREE.MeshStandardMaterial({color:0x19e6ff,emissive:0x19e6ff,emissiveIntensity:.75,metalness:.4,roughness:.25}),
      red=new THREE.MeshStandardMaterial({color:0xe11d1d,metalness:.9,roughness:.22,envMapIntensity:1.2}),
      black=new THREE.MeshStandardMaterial({color:0x0b0b0d,metalness:.85,roughness:.2,envMapIntensity:1.4}),
      lg=new THREE.TorusGeometry(.26,.07,18,36),X=new THREE.Vector3(1,0,0);
  var gc=document.createElement('canvas');gc.width=gc.height=64;var gx=gc.getContext('2d'),gr=gx.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');gx.fillStyle=gr;gx.fillRect(0,0,64,64);
  var glowTex=new THREE.CanvasTexture(gc);

  /* path to the right */
  var pts=[];for(var i=0;i<=40;i++){var x=-8+i*1.5;pts.push(new THREE.Vector3(x,Math.sin(x*.42)*.32-x*.012,Math.sin(x*.27)*.7))}
  var curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.5),L=curve.getLength(),K=Math.floor(L/.56);
  var samp=curve.getPoints(900);
  function atX(x){var b=0,bd=1e9;for(var i=0;i<samp.length;i++){var d=Math.abs(samp[i].x-x);if(d<bd){bd=d;b=i}}return samp[b]}

  function tex(i,x){var c=document.createElement('canvas');c.width=640;c.height=380;var g=c.getContext('2d');
    var gr=g.createLinearGradient(0,0,640,380);gr.addColorStop(0,'#1a0709');gr.addColorStop(1,'#3a0b10');g.fillStyle=gr;g.fillRect(0,0,640,380);
    g.fillStyle='#e11d1d';g.fillRect(0,0,16,380);g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=4;g.strokeRect(2,2,636,376);
    g.fillStyle='rgba(255,255,255,.13)';g.font='800 150px sans-serif';g.fillText('0'+(i+1),430,170);
    var fs=62;g.font='800 '+fs+'px sans-serif';while(g.measureText(x.t).width>560&&fs>28){fs-=3;g.font='800 '+fs+'px sans-serif'}
    g.fillStyle='#19e6ff';g.fillText(x.t,44,232);
    g.fillStyle='#d6dde2';g.font='600 27px sans-serif';var w=x.d.split(' '),ln='',y=282;
    w.forEach(function(q){var t=ln?ln+' '+q:q;if(g.measureText(t).width>560){g.fillText(ln,44,y);ln=q;y+=34}else ln=t});g.fillText(ln,44,y);
    g.fillStyle='#7f8b92';g.font='600 22px sans-serif';g.fillText('spike123net.github.io/Spike.net',44,356);
    var t=new THREE.CanvasTexture(c);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t}
  var TX=D.map(function(x,i){return tex(i,x)});

  function spikyBall(){var g=new THREE.Group(),ico=new THREE.IcosahedronGeometry(.62,1);
    g.add(new THREE.Mesh(new THREE.SphereGeometry(.6,32,24),chrome));
    var cg=new THREE.ConeGeometry(.15,.95,12),pos=ico.attributes.position,seen={},up=new THREE.Vector3(0,1,0);
    for(var i=0;i<pos.count;i++){var v=new THREE.Vector3().fromBufferAttribute(pos,i),k=v.x.toFixed(3)+v.y.toFixed(3)+v.z.toFixed(3);if(seen[k])continue;seen[k]=1;
      var d=v.clone().normalize(),m=new THREE.Mesh(cg,i%5===0?red:black);m.position.copy(d).multiplyScalar(.85);m.quaternion.setFromUnitVectors(up,d);g.add(m)}
    var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff2a2a,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:.55,fog:false}));s.scale.set(4.2,4.2,1);g.add(s);return g}

  /* build the whole content once; called for the real scene and for its mirror */
  function build(parent,pick){
    var o={links:[],plaques:[],ball:null},chain=new THREE.Group();parent.add(chain);o.chain=chain;
    for(var i=0;i<K;i++){var u=(i+.5)/K,p=curve.getPointAt(u),tg=curve.getTangentAt(u),g=new THREE.Group(),mt=i%8===3?neon:i%8===7?red:chrome,m=new THREE.Mesh(lg,mt);
      m.scale.set(1.45,1,1);m.rotation.x=(i%2)*Math.PI/2;g.add(m);g.position.copy(p);g.quaternion.setFromUnitVectors(X,tg);chain.add(g);o.links.push(m);
      if(mt===neon){var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x19e6ff,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:.7,fog:false}));s.scale.set(1.7,1.7,1);g.add(s)}}
    D.forEach(function(x,i){
      var P=atX(PX[i]),big=i===D.length-1,sc=big?1.25:1,grp=new THREE.Group();grp.position.set(P.x,P.y-1.2*sc,P.z+.5);parent.add(grp);
      var face=new THREE.MeshStandardMaterial({map:TX[i],emissiveMap:TX[i],emissive:0xffffff,emissiveIntensity:.5,roughness:.45,metalness:.3});
      var card=new THREE.Mesh(new THREE.BoxGeometry(2.7,1.6,.09),[chrome,chrome,chrome,chrome,face,chrome]);card.userData.i=i;grp.add(card);if(pick)pick.push(card);
      var ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.04,12,24),chrome);ring.position.y=.9;grp.add(ring);
      var a=new THREE.Vector3(P.x,P.y,P.z),b=new THREE.Vector3(P.x,P.y-1.2*sc+.9*sc,P.z+.5),rod=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,8),chrome);
      rod.position.copy(a).add(b).multiplyScalar(.5);rod.scale.y=a.distanceTo(b);rod.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());parent.add(rod);
      grp.userData.sc=sc;o.plaques.push({g:grp,s:1,m:face,sc:sc})});
    var E=atX(PX[D.length-1]),ball=spikyBall();ball.position.set(E.x,E.y+2.1,E.z);parent.add(ball);o.ball=ball;
    return o}

  var hit=[],real=new THREE.Group(),mirror=new THREE.Group(),FY=-2.35;scene.add(real);scene.add(mirror);
  var A=build(real,hit),B=build(mirror,null);mirror.scale.y=-1;mirror.position.y=2*FY;
  var floor=new THREE.Mesh(new THREE.PlaneGeometry(260,50),new THREE.MeshStandardMaterial({color:0x040205,roughness:.12,metalness:.5,transparent:true,opacity:.8,depthWrite:false}));
  floor.rotation.x=-Math.PI/2;floor.position.y=FY;scene.add(floor);

  /* dust */
  var NP=500,pp=new Float32Array(NP*3);for(var i=0;i<NP;i++){pp[i*3]=-8+Math.random()*62;pp[i*3+1]=FY+Math.random()*7;pp[i*3+2]=-6+Math.random()*12}
  var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  scene.add(new THREE.Points(pg,new THREE.PointsMaterial({size:.05,color:0xaeeaf5,transparent:true,opacity:.5,depthWrite:false})));

  /* UI */
  var S0=.08,S1=.85,dots=$('dots'),act=-1;
  function uOf(x){return (x+8)/(L>0?curveSpan():60)}
  function curveSpan(){return samp[samp.length-1].x-samp[0].x}
  function sFor(i){var u=uOf(PX[i]-1.2);return Math.min(1,Math.max(0,(u-S0)/(S1-S0)))}
  D.forEach(function(x,i){var b=document.createElement('button');b.className='dot';b.type='button';b.setAttribute('aria-label','К станции '+(i+1)+': '+x.t);
    b.addEventListener('click',function(){var mx=document.documentElement.scrollHeight-innerHeight;scrollTo({top:sFor(i)*mx,behavior:rm?'auto':'smooth'})});dots.appendChild(b)});
  function setAct(i){if(i===act)return;act=i;$('cn').textContent='0'+(i+1)+' / 0'+D.length;$('ct').textContent=D[i].t;$('cd').textContent=D[i].d;
    $('cl').textContent=i===D.length-1?'Открыть Spike.net →':'Смотреть на Spike.net →';[].forEach.call(dots.children,function(b,k){b.setAttribute('aria-current',String(k===i))})}

  function size(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
  var ptr={x:0,y:0},ray=new THREE.Raycaster(),nd=new THREE.Vector2(),sx=0,sy=0;
  function pickAt(e){nd.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(nd,cam);var h=ray.intersectObjects(hit,false);return h.length?h[0].object.userData.i:-1}
  addEventListener('pointermove',function(e){ptr.x=e.clientX/innerWidth*2-1;ptr.y=-(e.clientY/innerHeight)*2+1;if(e.pointerType==='mouse')document.body.style.cursor=pickAt(e)>-1?'pointer':''});
  addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});
  addEventListener('pointerup',function(e){if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)return;if(e.target.closest&&e.target.closest('a,button,.card'))return;if(pickAt(e)>-1)window.open(SITE,'_blank','noopener,noreferrer')});

  /* loop */
  var sS=0,last=performance.now(),T=0,look=new THREE.Vector3();
  function animate(o,t,best,bd){
    if(!rm)for(var i=0;i<o.links.length;i++)o.links[i].rotation.x=(i%2)*Math.PI/2+Math.sin(t*1.2+i*.5)*.07;
    o.plaques.forEach(function(q,i){q.g.rotation.y=Math.max(-.5,Math.min(.5,Math.atan2(cam.position.x-q.g.position.x,cam.position.z-q.g.position.z)));
      var k=(i===best&&bd<5?1.1:1)*q.sc;q.s+=(k-q.s)*.1;q.g.scale.setScalar(q.s);q.m.emissiveIntensity=i===best?.7+(rm?0:Math.sin(t*3)*.08):.42});
    o.ball.rotation.y=t*.5;o.ball.rotation.x=t*.2}
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
    var mx=Math.max(1,document.documentElement.scrollHeight-innerHeight),s=Math.min(1,Math.max(0,scrollY/mx));
    sS+=(s-sS)*(1-Math.exp(-dt*(rm?20:5)));
    var u=S0+sS*(S1-S0),P=curve.getPointAt(u),narrow=cam.aspect<.8;
    cam.position.set(P.x-(narrow?.5:0),P.y+1.05+ptr.y*.25,P.z+(narrow?6.2:4.6));cam.position.x+=ptr.x*.5;
    look.copy(curve.getPointAt(Math.min(1,u+.05)));look.y-=.45;cam.lookAt(look);
    var best=0,bd=99;PX.forEach(function(p,i){var d=Math.abs(p-look.x);if(d<bd){bd=d;best=i}});setAct(best);
    animate(A,T,best,bd);animate(B,T,best,bd);floor.position.x=cam.position.x;
    $('hero').style.opacity=Math.max(0,1-s*16);$('card').style.opacity=Math.min(1,Math.max(0,(s-.03)*16));$('pct').textContent=Math.round(s*100)+'%';
    R.render(scene,cam);requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
